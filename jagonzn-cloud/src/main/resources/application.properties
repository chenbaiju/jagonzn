# 应用名用于区分后续 SaaS 服务与设备接入服务。
spring.application.name=jagonzn-cloud
# 只监听部署内部管理接口；内网 TLS 由受控代理终止。
server.port=18081
server.address=${JAGONZN_CLOUD_BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# cloud 使用独立数据库；缺少配置时拒绝启动，不借用 service 库。
spring.datasource.url=${JAGONZN_CLOUD_DATABASE_URL}
spring.datasource.username=${JAGONZN_CLOUD_DATABASE_USER}
spring.datasource.password=${JAGONZN_CLOUD_DATABASE_PASSWORD}
# 私有事件入口默认关闭；启用时所有绑定和签名配置必须显式提供。
jagonzn.cloud.service-events.enabled=${JAGONZN_CLOUD_SERVICE_EVENTS_ENABLED:false}
jagonzn.cloud.service-events.source-deployment-id=${JAGONZN_CLOUD_SERVICE_SOURCE_DEPLOYMENT_ID:}
jagonzn.cloud.service-events.tenant-id=${JAGONZN_CLOUD_SERVICE_TENANT_ID:}
jagonzn.cloud.service-events.project-id=${JAGONZN_CLOUD_SERVICE_PROJECT_ID:}
jagonzn.cloud.service-events.project-ids=${JAGONZN_CLOUD_SERVICE_PROJECT_IDS:}
jagonzn.cloud.service-events.key-id=${JAGONZN_CLOUD_SERVICE_KEY_ID:}
jagonzn.cloud.service-events.secret-base64=${JAGONZN_CLOUD_SERVICE_SECRET_BASE64:}
jagonzn.cloud.service-events.previous-key-id=${JAGONZN_CLOUD_SERVICE_PREVIOUS_KEY_ID:}
jagonzn.cloud.service-events.previous-secret-base64=${JAGONZN_CLOUD_SERVICE_PREVIOUS_SECRET_BASE64:}
