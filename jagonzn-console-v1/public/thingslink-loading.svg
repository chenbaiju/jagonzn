<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="loading-highlight" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#1e88e5" stop-opacity="0.6" />
            <stop offset="0.12" stop-color="#1e88e5" />
            <stop offset="0.88" stop-color="#1e88e5" />
            <stop offset="1" stop-color="#1e88e5" stop-opacity="0.6" />
        </linearGradient>
    </defs>

    <text x="100" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5" fill="#1e88e5">ThingsLink</text>

    <!-- Indeterminate loading bar with a highlight moving back and forth. -->
    <rect x="10" y="62" width="180" height="3" fill="#e5e7eb" />
    <rect x="10" y="62" width="38" height="3" fill="url(#loading-highlight)">
        <animate attributeName="x" values="10;152;10" dur="2.6s" repeatCount="indefinite"
            calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    </rect>
</svg>
