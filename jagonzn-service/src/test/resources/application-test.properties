# 测试使用独立容器；不连接开发机上可能存在的共享 Kafka 与对象存储。
things-cloud.security.jwt.secret=jagonzn-test-console-jwt-secret-32-bytes
things-cloud.security.app-jwt.secret=jagonzn-test-app-jwt-secret-32-bytes
things-cloud.security.broker-callback.secret=jagonzn-test-broker-callback-secret-32-bytes
things-cloud.notification.webhook.signing-secret=jagonzn-test-notification-webhook-secret-32-bytes
spring.kafka.admin.auto-create=false
spring.kafka.bootstrap-servers=127.0.0.1:19092
spring.kafka.listener.auto-startup=false
things-cloud.kafka.concurrency-guard.enabled=false
# 使用同步客户端避开本机 Windows/Temurin 的 Netty selector 初始化故障。
spring.data.redis.client-type=jedis
spring.data.redis.password=
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
things-cloud.storage.internal-endpoint=http://127.0.0.1:19000
things-cloud.storage.external-endpoint=http://127.0.0.1:19000
things-cloud.storage.access-key=jagonzn-test-access
things-cloud.storage.secret-key=jagonzn-test-secret
things-cloud.commercial.subscription-lifecycle.enabled=false
things-cloud.project.cleanup.enabled=false
things-cloud.datasource.control.maximum-pool-size=2
things-cloud.datasource.control.minimum-idle=0
things-cloud.datasource.data.maximum-pool-size=2
things-cloud.datasource.data.minimum-idle=0
things-cloud.scheduling.shutdown-await-seconds=0
