# 独立启动配置；未显式启用时失败，不继承application.properties中的数据库或内核凭据。
spring.application.name=jagonzn-jt808-remote
things-link.runtime.embedded=false
jagonzn.jt808.remote.enabled=${JAGONZN_JT808_REMOTE_ENABLED:false}
jagonzn.jt808.remote.scope-file=${JAGONZN_JT808_REMOTE_SCOPE_FILE:}
# 只显式导入远程装配，旧发送器及内核协议开关必须保持关闭。
jagonzn.jt808.enabled=${JAGONZN_JT808_ENABLED:false}
jagonzn.jt808.logs.delivery-enabled=${JAGONZN_JT808_LOG_DELIVERY_ENABLED:false}
jagonzn.cloud.private-delivery.enabled=${JAGONZN_CLOUD_PRIVATE_DELIVERY_ENABLED:false}
things-link.ingress.handoff.enabled=false
jagonzn.jt808.external-root=${JAGONZN_JT808_EXTERNAL_ROOT:}
jagonzn.jt808.crypto-file=${JAGONZN_JT808_CRYPTO_FILE:}
jagonzn.jt808.binding-file=${JAGONZN_JT808_BINDING_FILE:}
jagonzn.jt808.logs.directory=${JAGONZN_JT808_LOGS_DIRECTORY:}
jagonzn.jt808.bind-address=${JAGONZN_JT808_BIND_ADDRESS:127.0.0.1}
jagonzn.jt808.port=${JAGONZN_JT808_PORT:16809}
server.address=127.0.0.1
server.port=18082
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# 远程进程不公开接口文档或业务管理入口。
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
