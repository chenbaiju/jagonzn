# 应用名用于区分 jagonzn 独立验证服务的日志和运行身份。
spring.application.name=jagonzn-service

# 运行身份、令牌签名和 Broker 回调只能取本部署密钥，不能继承平台开发默认或原部署秘密。
things-cloud.security.jwt.issuer=jagonzn
things-cloud.security.jwt.secret=${JAGONZN_SECURITY_JWT_SECRET}
things-cloud.security.app-jwt.issuer=jagonzn-app
things-cloud.security.app-jwt.secret=${JAGONZN_SECURITY_APP_JWT_SECRET}
things-cloud.security.broker-callback.secret=${JAGONZN_SECURITY_BROKER_CALLBACK_SECRET}
# 持久 handoff 默认关闭；显式启用时需提供本部署 Broker 地址与独立强密码。
things-cloud.ingress.handoff.enabled=${JAGONZN_INGRESS_HANDOFF_ENABLED:false}
things-cloud.ingress.handoff.broker-uri=${JAGONZN_INGRESS_HANDOFF_BROKER_URI:tcp://localhost:1883}
things-cloud.ingress.handoff.password=${JAGONZN_INGRESS_HANDOFF_PASSWORD:}

# 平台拥有全量组件扫描与装配规则；本应用只启用正式入口，不扫描平台内部包。
things-cloud.runtime.embedded=true
things-cloud.deployment.entitlement-mode=${JAGONZN_ENTITLEMENT_MODE:COMMERCIAL}
# 正式签名授权模式仅在受控公钥已封入发行物且现场身份存在后启用。
jagonzn.self-hosted.signed-grant.enabled=${JAGONZN_SIGNED_GRANT_ENABLED:false}
# 普通发行物只从固定资源读取正式公钥；测试来源仅由测试类路径装配，普通 JAR 选择它会启动失败。
jagonzn.self-hosted.signed-grant.trust-source=packaged
jagonzn.self-hosted.identity-directory=${JAGONZN_DEPLOYMENT_IDENTITY_DIRECTORY:}
things-cloud.commercial.subscription-lifecycle.enabled=false
things-cloud.deployment.noncommercial-capacity.projects=${JAGONZN_TECHNICAL_PROJECTS:}
things-cloud.deployment.noncommercial-capacity.devices=${JAGONZN_TECHNICAL_DEVICES:}
things-cloud.deployment.noncommercial-capacity.end-users=${JAGONZN_TECHNICAL_END_USERS:}
things-cloud.deployment.noncommercial-capacity.dashboards=${JAGONZN_TECHNICAL_DASHBOARDS:}
things-cloud.deployment.noncommercial-capacity.external-seats=${JAGONZN_TECHNICAL_EXTERNAL_SEATS:}
things-cloud.deployment.noncommercial-capacity.history-days=${JAGONZN_TECHNICAL_HISTORY_DAYS:}
things-cloud.deployment.noncommercial-capacity.daily.uplink-message=${JAGONZN_TECHNICAL_DAILY_UPLINK_MESSAGE:}
things-cloud.deployment.noncommercial-capacity.daily.downlink-message=${JAGONZN_TECHNICAL_DAILY_DOWNLINK_MESSAGE:}
things-cloud.deployment.noncommercial-capacity.daily.uplink-bytes=${JAGONZN_TECHNICAL_DAILY_UPLINK_BYTES:}
things-cloud.deployment.noncommercial-capacity.daily.time-series-point=${JAGONZN_TECHNICAL_DAILY_TIME_SERIES_POINT:}
things-cloud.deployment.noncommercial-capacity.daily.rest-api-call=${JAGONZN_TECHNICAL_DAILY_REST_API_CALL:}
things-cloud.deployment.noncommercial-capacity.daily.notification-delivery=${JAGONZN_TECHNICAL_DAILY_NOTIFICATION_DELIVERY:}
things-cloud.deployment.noncommercial-capacity.daily.script-execution=${JAGONZN_TECHNICAL_DAILY_SCRIPT_EXECUTION:}
things-cloud.deployment.noncommercial-capacity.daily.automation-execution=${JAGONZN_TECHNICAL_DAILY_AUTOMATION_EXECUTION:}
things-cloud.deployment.noncommercial-capacity.daily.script-cpu-millis=${JAGONZN_TECHNICAL_DAILY_SCRIPT_CPU_MILLIS:}

# 独立部署的库、迁移 owner 和运行角色统一使用 jagonzn 命名，密码分别外部注入。
spring.datasource.url=${JAGONZN_DATABASE_URL}
spring.datasource.username=jagonzn_app
spring.datasource.password=${JAGONZN_DATABASE_APP_PASSWORD}
spring.flyway.url=${JAGONZN_DATABASE_URL}
spring.flyway.user=jagonzn
spring.flyway.password=${JAGONZN_DATABASE_OWNER_PASSWORD}
spring.flyway.placeholders.app_role_password=${JAGONZN_DATABASE_APP_PASSWORD}
things-cloud.runtime.database.app-role=jagonzn_app
# 连接池和运行诊断沿用同一部署前缀，避免日志中混用原应用实例名。
things-cloud.datasource.control.pool-name=jagonzn-control
things-cloud.datasource.data.pool-name=jagonzn-data
things-cloud.ingress.handoff.username=jagonzn-uplink-ingress
things-cloud.ingress.handoff.client-id=jagonzn-uplink-ingress-v1
# 部署邮件、控制台 URL、EMQX 管理/会话身份均从 jagonzn 配置读取。
spring.mail.host=${JAGONZN_MAIL_SMTP_HOST:}
spring.mail.port=${JAGONZN_MAIL_SMTP_PORT:}
spring.mail.username=${JAGONZN_MAIL_SMTP_USERNAME:}
spring.mail.password=${JAGONZN_MAIL_SMTP_PASSWORD:}
things-cloud.mail.from-name=jagonzn
things-cloud.console.base-url=${JAGONZN_CONSOLE_BASE_URL:http://localhost:3006}
things-cloud.ingestion.emqx-api.base-url=${JAGONZN_EMQX_API_BASE_URL:http://localhost:18083}
things-cloud.ingestion.emqx-api.api-key=${JAGONZN_EMQX_API_KEY:}
things-cloud.ingestion.emqx-api.api-secret=${JAGONZN_EMQX_API_SECRET:}
things-cloud.device.emqx-session-api.base-url=${JAGONZN_EMQX_SESSION_API_BASE_URL:http://localhost:18083}
things-cloud.device.emqx-session-api.api-key=${JAGONZN_EMQX_SESSION_API_KEY:}
things-cloud.device.emqx-session-api.api-secret=${JAGONZN_EMQX_SESSION_API_SECRET:}
things-cloud.realtime.channel-prefix=jagonzn:realtime:
# 各模块 SQL 从同版本平台 JAR 确定性提取，仅替换六种角色标识；不改表、列或函数结构。
spring.flyway.locations=classpath:jagonzn/db/migration/support,classpath:jagonzn/db/migration/project,classpath:jagonzn/db/migration/device,classpath:jagonzn/db/migration/telemetry,classpath:jagonzn/db/migration/alarm,classpath:jagonzn/db/migration/task,classpath:jagonzn/db/migration/rule,classpath:jagonzn/db/migration/iam,classpath:jagonzn/db/migration/enduser,classpath:jagonzn/db/migration/export,classpath:jagonzn/db/migration/dashboard,classpath:jagonzn/db/migration/ota,classpath:jagonzn/db/migration/integration

# Kafka 消费组使用 jagonzn 部署身份；Topic 与部分资源仍按平台协议固定，首批运行须使用隔离的资源实例。
things-cloud.kafka.group-prefix=jagonzn
spring.kafka.consumer.group-id=jagonzn-ingestion
# 新私有消费组初次启动必须从已持久保留的源起点读取，不丢启动前积压。
spring.kafka.consumer.auto-offset-reset=earliest
# 标准接入按部署显式启用；HTTP 使用本服务的 18080 并要求 HTTPS，TCP/CoAP 启用时须提供本部署 PEM。
things-cloud.access.http.enabled=${JAGONZN_DEVICE_HTTP_ENABLED:false}
things-cloud.access.tcp.enabled=${JAGONZN_DEVICE_TCP_ENABLED:false}
things-cloud.access.coap.enabled=${JAGONZN_DEVICE_COAP_ENABLED:false}
things-cloud.access.tls.certificate=${JAGONZN_DEVICE_TLS_CERTIFICATE:}
things-cloud.access.tls.private-key=${JAGONZN_DEVICE_TLS_PRIVATE_KEY:}
things-cloud.access.tls.key-password=${JAGONZN_DEVICE_TLS_KEY_PASSWORD:}
things-cloud.access.tcp.port=${JAGONZN_DEVICE_TCP_PORT:18883}
things-cloud.access.coap.port=${JAGONZN_DEVICE_COAP_PORT:15684}
things-cloud.access.tcp.bind-address=${JAGONZN_DEVICE_TCP_BIND_ADDRESS:127.0.0.1}
things-cloud.access.coap.bind-address=${JAGONZN_DEVICE_COAP_BIND_ADDRESS:127.0.0.1}
spring.data.redis.host=${JAGONZN_REDIS_HOST}
spring.data.redis.port=${JAGONZN_REDIS_PORT}
spring.data.redis.password=${JAGONZN_REDIS_PASSWORD}
spring.kafka.bootstrap-servers=${JAGONZN_KAFKA_BOOTSTRAP_SERVERS}
things-cloud.storage.internal-endpoint=${JAGONZN_MINIO_INTERNAL_ENDPOINT}
things-cloud.storage.external-endpoint=${JAGONZN_MINIO_EXTERNAL_ENDPOINT}
things-cloud.storage.access-key=${JAGONZN_MINIO_APP_ACCESS_KEY}
things-cloud.storage.secret-key=${JAGONZN_MINIO_APP_SECRET_KEY}
# OTA 私桶名称归属 jagonzn；部署前须完成版本化与私有策略资格。
things-cloud.ota.storage.bucket=${JAGONZN_OTA_STORAGE_BUCKET:jagonzn-ota}
# 可选的公开能力启用时也必须使用独立签名与 Broker 凭据。
things-cloud.integration.api-key.enabled=${JAGONZN_PUBLIC_API_KEY_ENABLED:false}
things-cloud.integration.webhook.enabled=${JAGONZN_PUBLIC_WEBHOOK_ENABLED:false}
# 可信内部事件源与公开 Webhook 分别启用；私网 cloud 发送端默认关闭。
things-cloud.integration.internal-event-source.enabled=${JAGONZN_CLOUD_INTERNAL_EVENT_SOURCE_ENABLED:false}
jagonzn.cloud.private-delivery.enabled=${JAGONZN_CLOUD_PRIVATE_DELIVERY_ENABLED:false}
jagonzn.cloud.private-delivery.url=${JAGONZN_CLOUD_PRIVATE_DELIVERY_URL:}
jagonzn.cloud.private-delivery.source-deployment-id=${JAGONZN_CLOUD_SOURCE_DEPLOYMENT_ID:}
jagonzn.cloud.private-delivery.tenant-id=${JAGONZN_CLOUD_TENANT_ID:}
jagonzn.cloud.private-delivery.project-id=${JAGONZN_CLOUD_PROJECT_ID:}
jagonzn.cloud.private-delivery.project-ids=${JAGONZN_CLOUD_PROJECT_IDS:}
jagonzn.cloud.private-delivery.key-id=${JAGONZN_CLOUD_KEY_ID:}
jagonzn.cloud.private-delivery.secret-base64=${JAGONZN_CLOUD_SECRET_BASE64:}
things-cloud.integration.webhook.signing-keys-json=${JAGONZN_PUBLIC_WEBHOOK_SIGNING_KEYS_JSON:}
things-cloud.integration.webhook.current-signing-key-id=${JAGONZN_PUBLIC_WEBHOOK_CURRENT_SIGNING_KEY_ID:}
things-cloud.integration.realtime.enabled=${JAGONZN_PUBLIC_REALTIME_ENABLED:false}
things-cloud.integration.realtime.ws.allowed-origins=${JAGONZN_REALTIME_WS_ALLOWED_ORIGINS:}
things-cloud.integration.realtime.mqtt-api.base-url=${JAGONZN_REALTIME_MQTT_API_BASE_URL:}
things-cloud.integration.realtime.mqtt-api.api-key=${JAGONZN_REALTIME_MQTT_API_KEY:}
things-cloud.integration.realtime.mqtt-api.api-secret=${JAGONZN_REALTIME_MQTT_API_SECRET:}
things-cloud.integration.realtime.mqtt-api.session-api-key=${JAGONZN_REALTIME_MQTT_SESSION_API_KEY:}
things-cloud.integration.realtime.mqtt-api.session-api-secret=${JAGONZN_REALTIME_MQTT_SESSION_API_SECRET:}
things-cloud.notification.webhook.signing-secret=${JAGONZN_NOTIFICATION_WEBHOOK_SIGNING_SECRET:}
# 独立服务默认使用 18080，避开 ThingsCloud bootstrap 的 8080 和模拟器的 8090。
server.port=18080
# 仅公开进程健康状态；不能据此判断内核、数据库或设备链路已就绪。
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
