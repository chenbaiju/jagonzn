# 独立本机资源；只允许外盘脚本指向专用Lima守护进程。
name: jagonzn-jt808-lab
networks:
  lab:
volumes:
  postgres:
  redis:
  kafka:
  minio:
  mail:
services:
  postgres:
    image: timescale/timescaledb-ha:pg17.4-ts2.18.2
    networks: [lab]
    labels: {io.jagonzn.lab: jt808-runtime}
    environment:
      POSTGRES_USER: jagonzn
      POSTGRES_DB: jagonzn
      POSTGRES_PASSWORD: ${JAGONZN_LAB_DB_OWNER_PASSWORD:?required}
      PGDATA: /home/postgres/pgdata/data
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_NUM_CPUS: 2
    command: [postgres, -c, shared_preload_libraries=timescaledb, -c, shared_buffers=128MB, -c, max_connections=100]
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres:/home/postgres/pgdata"]
    mem_limit: 1g
    healthcheck:
      test: [CMD, pg_isready, -U, jagonzn, -d, jagonzn]
      interval: 3s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7.4-alpine
    networks: [lab]
    labels: {io.jagonzn.lab: jt808-runtime}
    environment:
      REDISCLI_AUTH: ${JAGONZN_LAB_REDIS_PASSWORD:?required}
    command: [redis-server, --requirepass, "${JAGONZN_LAB_REDIS_PASSWORD:?required}", --maxmemory, 128mb, --maxmemory-policy, noeviction, --appendonly, "yes"]
    ports: ["127.0.0.1:26379:6379"]
    volumes: ["redis:/data"]
    mem_limit: 192m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 5s
      retries: 40
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    networks: [lab]
    labels: {io.jagonzn.lab: jt808-runtime}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:39092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:39092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports: ["127.0.0.1:39092:39092"]
    volumes: ["kafka:/var/lib/redpanda/data"]
    mem_limit: 1536m
    healthcheck:
      test: [CMD-SHELL, "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 40
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    networks: [lab]
    labels: {io.jagonzn.lab: jt808-runtime}
    environment:
      MINIO_ROOT_USER: jagonzn_lab_root
      MINIO_ROOT_PASSWORD: ${JAGONZN_LAB_S3_ROOT_PASSWORD:?required}
    command: [server, /data, --console-address, ":9001"]
    ports: ["127.0.0.1:29000:9000", "127.0.0.1:29001:9001"]
    volumes: ["minio:/data"]
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 40
  mail:
    image: jagonzn-jt808/mailpit:1.32.0
    pull_policy: never
    networks: [lab]
    labels: {io.jagonzn.lab: jt808-runtime}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 100
    ports: ["127.0.0.1:21025:1025", "127.0.0.1:28025:8025"]
    volumes: ["mail:/data"]
    mem_limit: 128m
